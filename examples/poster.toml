# A research poster (FES + PMF) expressed in the flat id-keyed schema.
# Text/image rendering land in later milestones; the structure resolves and
# lays out today.
[page]
width = 100
height = 150
unit = "cm"
root = "root"
background = "#ffffff"

[nodes.root]
type = "column"
spacing = 2
padding = 1.5
cross_axis_alignment = "center"
children = ["header", "body", "footer"]

# --- header ---
[nodes.header]
type = "column"
spacing = 0.5
cross_axis_alignment = "center"
children = ["title", "subtitle"]

[nodes.title]
type = "text"
content = "Free Energy Surface Analysis"
font_size = 48
font_weight = 700
align = "center"

[nodes.subtitle]
type = "text"
content = "MD Simulation Results"
font_size = 24
color = "#666666"
align = "center"

# --- body: two panels side by side ---
[nodes.body]
type = "row"
flex = 1
spacing = 1.5
main_axis_alignment = "space_around"
cross_axis_alignment = "stretch"
children = ["left", "right"]

[nodes.left]
type = "column"
flex = 1
spacing = 0.5
children = ["fes", "fes_cap"]

[nodes.fes]
type = "image"
src = "fes.png"
aspect_ratio = 1.0

[nodes.fes_cap]
type = "text"
content = "(a) FES 2D Landscape"
font_size = 14
align = "center"

[nodes.right]
type = "column"
flex = 1
spacing = 0.5
children = ["pmf", "pmf_cap"]

[nodes.pmf]
type = "image"
src = "pmf.png"
aspect_ratio = 2.0

[nodes.pmf_cap]
type = "text"
content = "(b) PMF Profile"
font_size = 14
align = "center"

# --- footer ---
[nodes.footer]
type = "text"
content = "Simulation: GROMACS 2024, FF: AMBER99SB"
font_size = 10
color = "#999999"
align = "center"
