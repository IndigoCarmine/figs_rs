[package]
name = "figs-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Desktop Editor + Viewer (egui) for figs: edit a TOML document and preview it live."

[[bin]]
name = "figs-editor"
path = "src/main.rs"

[dependencies]
figs-core = { path = "../figs-core" }
eframe = "0.29"
rfd = "0.15"
toml = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
