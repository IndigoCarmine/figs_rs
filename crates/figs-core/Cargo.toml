[package]
name = "figs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless layout engine for poster/figure composition: TOML -> layout -> PNG/PDF."

[dependencies]
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
tiny-skia = "0.11"
cosmic-text = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rhai = { version = "1.24", features = ["sync"], optional = true }

[features]
default = ["script"]
# The Rhai scripting front-end (`.figs`/`.rhai`): scripts evaluate to a
# `RawDocument` that flows through the existing resolve/layout/render pipeline.
script = ["dep:rhai"]
