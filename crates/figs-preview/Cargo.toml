[package]
name = "figs-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Live WYSIWYG-ish preview window for figs: renders a TOML layout and re-renders on every change."

[[bin]]
name = "figs-preview"
path = "src/main.rs"

[dependencies]
figs-core = { path = "../figs-core" }
figs-cli = { path = "../figs-cli" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
notify-debouncer-mini = "0.7"
anyhow = { workspace = true }
